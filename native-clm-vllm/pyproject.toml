[project]
name = "ctxmgr"
version = "0.1.0"
description = "Who should manage an LLM agent's context? Self vs. peer managers across Qwen3.5 sizes."
readme = "README.md"
authors = [
    { name = "Ruthvik Edara" },
    { name = "Hancheng Xiang" },
    { name = "May Mei" },
]
requires-python = ">=3.12"
dependencies = [
    "contextbench[tokenizer]",
    "matplotlib>=3.11.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
serve = [
    "vllm==0.30.0 ; sys_platform == 'linux'",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]

[tool.uv.sources]
contextbench = { git = "https://github.com/RulinShao/ContextBench.git", rev = "fb533c18c78a82d3f1b2047a9c1700735cf829ae" }
# vLLM only runs on the Linux GPU nodes (cluster): `uv sync --group serve`.
# 0.30.0 is the first pinned version verified to ship qwen3_5.py.

[tool.ruff]
line-length = 100
